[package]
name = "ARO"
version = "0.1.0"
description = "ARO Desktop for Linux"
authors = ['leecolton167@gmail.com']
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
# Enable webkitgtk 6.0 (GTK4) for distros that don't ship webkit2gtk 4.1 (e.g. CentOS Stream 10)
webkitgtk-6-0 = ["tauri/webkitgtk-6.0"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
anyhow = "1.0"
tauri-build = { version = "^2.1", features = [] }

[dependencies]
anyhow = "1.0"
libc = "0.2"
libloading = "0.8"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "^2.1", features = ["tray-icon"] }
tauri-utils = "^2.1"
tauri-plugin-log = "^2"
tauri-plugin-shell = "^2"
time = { version = "0.3", features = ["formatting", "local-offset"] }
reqwest = { version = "0.11", features = ["blocking"] }
bytes = "1"
semver = "1.0"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
url = "2"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-dialog = "^2"
