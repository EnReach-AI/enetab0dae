[package]
name = "ARO"
version = "0.1.0"
description = "ARO Desktop for Linux (Debian 11)"
authors = ['leecolton167@gmail.com']
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
anyhow = "1.0"
tauri-build = { version = "~1.2.0", features = [] }

[dependencies]
anyhow = "1.0"
libc = "0.2"
libloading = "0.8"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "~1.2.0", features = ["tray-icon"] }
tauri-utils = "=1.2.0"
tauri-plugin-log = "1.2.0"
tauri-plugin-shell = "1.2.0"
time = { version = "0.3", features = ["formatting", "local-offset"] }
reqwest = { version = "0.11", features = ["blocking"] }
bytes = "1"
semver = "1.0"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-dialog = "1.2.0"
