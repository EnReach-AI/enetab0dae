app-id: com.aro.ARONetwork
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
command: aro-desktop

# Keep permissions minimal; add more as needed.
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: aro-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 flatpak/stage/ARO /app/bin/aro-desktop
      - install -Dm755 flatpak/stage/libstudy.so /app/bin/resources/libstudy.so
      - install -Dm644 flatpak/com.aro.ARONetwork.desktop /app/share/applications/com.aro.ARONetwork.desktop
      - install -Dm644 flatpak/com.aro.ARONetwork.metainfo.xml /app/share/metainfo/com.aro.ARONetwork.metainfo.xml
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/com.aro.ARONetwork.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.aro.ARONetwork.png
    sources:
      # Build step only stages files; compilation happens in CI before flatpak-builder.
      - type: dir
        path: ..
        
    cleanup:
      - rm -rf /home/client/.var/app/com.aro.ARONetwork
      - rm -rf /home/client/.var/app/com.aro.ARONetwork/data/com.aro.ARONetwork
