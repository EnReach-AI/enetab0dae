name: Build All

on:
  push:
    branches: ["main"]
    paths:
      - "core/**"
      - "apps/aro_client/**"
      - "apps/aro_linux/**"
      - "Dockerfile.*"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "core/**"
      - "apps/aro_client/**"
      - "apps/aro_linux/**"
  workflow_dispatch:

env:
  FLUTTER_DIR: apps/aro_client

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Parse commit tags
    runs-on: ubuntu-latest
    outputs:
      build_core: ${{ steps.flags.outputs.build_core }}
      win: ${{ steps.flags.outputs.win }}
      mac: ${{ steps.flags.outputs.mac }}
      linux: ${{ steps.flags.outputs.linux }}
      aro_linux: ${{ steps.flags.outputs.aro_linux }}
      android: ${{ steps.flags.outputs.android }}
      ios: ${{ steps.flags.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          MSG="$(git log -1 --pretty=%B)"
          echo "Commit message: $MSG"

          if [[ "$MSG" == *"[all]"* ]]; then
            echo "build_core=true" >> $GITHUB_OUTPUT
            echo "linux=true" >> $GITHUB_OUTPUT
            echo "aro_linux=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED_FILES=""
          if [[ "${EVENT_NAME}" == "pull_request" && -n "${PR_BASE_SHA}" && -n "${PR_HEAD_SHA}" ]]; then
            git fetch --no-tags --prune --depth=1 origin "${PR_BASE_SHA}" "${PR_HEAD_SHA}" || true
            CHANGED_FILES="$(git diff --name-only "${PR_BASE_SHA}" "${PR_HEAD_SHA}" || true)"
          elif [[ "${EVENT_NAME}" == "push" && -n "${PUSH_BEFORE}" ]]; then
            if [[ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
              git fetch --no-tags --prune --depth=1 origin "${PUSH_BEFORE}" "${CURRENT_SHA}" || true
              CHANGED_FILES="$(git diff --name-only "${PUSH_BEFORE}" "${CURRENT_SHA}" || true)"
            else
              CHANGED_FILES="$(git show --name-only --pretty='' "${CURRENT_SHA}" || true)"
            fi
          else
            CHANGED_FILES="$(git show --name-only --pretty='' "${CURRENT_SHA}" || true)"
          fi

          if printf '%s\n' "${CHANGED_FILES}" | grep -q '^core/'; then
            echo "build_core=true" >> $GITHUB_OUTPUT
          fi

          if printf '%s\n' "${CHANGED_FILES}" | grep -q '^apps/aro_client/'; then
            echo "linux=true" >> $GITHUB_OUTPUT
          fi

          if printf '%s\n' "${CHANGED_FILES}" | grep -q '^apps/aro_linux/'; then
            echo "aro_linux=true" >> $GITHUB_OUTPUT
          fi

          [[ "$MSG" == *"[win]"* ]] && echo "win=true" >> $GITHUB_OUTPUT
          [[ "$MSG" == *"[mac]"* ]] && echo "mac=true" >> $GITHUB_OUTPUT
          [[ "$MSG" == *"[linux]"* ]] && echo "linux=true" >> $GITHUB_OUTPUT
          [[ "$MSG" == *"[aro_linux]"* ]] && echo "aro_linux=true" >> $GITHUB_OUTPUT
          [[ "$MSG" == *"[android]"* ]] && echo "android=true" >> $GITHUB_OUTPUT
          [[ "$MSG" == *"[ios]"* ]] && echo "ios=true" >> $GITHUB_OUTPUT

          exit 0

  # ============================================================
  # Core Library Build Jobs
  # ============================================================

  build-core-linux:
    needs: prepare
    if: needs.prepare.outputs.build_core == 'true'
    # if: false
    name: Build Core Linux x64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up SSH key for private repos
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Configure private repository access
        run: |
          go env -w GOPRIVATE=github.com/aro-network/*
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Build Linux x64
        run: |
          cd core
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build \
            -buildmode=c-shared -trimpath -ldflags="-s -w -buildid=" \
            -o ../plugins/linux/libstudy.so ./pkg/libstudy
          ls -lh ../plugins/linux/libstudy.so

      - name: Copy library to Flutter FFI directory
        run: |
          mkdir -p apps/aro_client/lib/ffi/linux
          cp plugins/linux/libstudy.so apps/aro_client/lib/ffi/linux/
          ls -lh apps/aro_client/lib/ffi/linux/libstudy.so

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libstudy-linux
          path: plugins/linux/

  build-core-linux-arm64:
    needs: prepare
    if: needs.prepare.outputs.build_core == 'true'
    name: Build Core Linux ARM64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up SSH key for private repos
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Configure private repository access
        run: |
          go env -w GOPRIVATE=github.com/aro-network/*
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Install ARM64 cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Linux ARM64
        run: |
          cd core
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build \
            -buildmode=c-shared -trimpath -ldflags="-s -w -buildid=" \
            -o ../plugins/linux-arm64/libstudy.so ./pkg/libstudy
          ls -lh ../plugins/linux-arm64/libstudy.so

      - name: Copy library to Flutter FFI directory
        run: |
          mkdir -p apps/aro_client/lib/ffi/linux-arm64
          cp plugins/linux-arm64/libstudy.so apps/aro_client/lib/ffi/linux-arm64/
          ls -lh apps/aro_client/lib/ffi/linux-arm64/libstudy.so

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libstudy-linux-arm64
          path: plugins/linux-arm64/

  build-core-windows:
    needs: prepare
    if: needs.prepare.outputs.build_core == 'true'
    name: Build Core Windows x64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up SSH key for private repos
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Configure private repository access
        run: |
          go env -w GOPRIVATE=github.com/aro-network/*
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build Windows x64
        run: |
          cd core
          CC=x86_64-w64-mingw32-gcc CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build \
            -buildmode=c-shared -trimpath -ldflags="-s -w -buildid=" \
            -o ../plugins/windows/libstudy.dll ./pkg/libstudy
          ls -lh ../plugins/windows/libstudy.dll

      - name: Copy library to Flutter FFI directory
        run: |
          mkdir -p apps/aro_client/lib/ffi/windows
          cp plugins/windows/libstudy.dll apps/aro_client/lib/ffi/windows/
          ls -lh apps/aro_client/lib/ffi/windows/libstudy.dll

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libstudy-windows
          path: plugins/windows/

  build-core-macos-arm64:
    needs: prepare
    if: needs.prepare.outputs.build_core == 'true'
    name: Build Core macOS - arm64
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up SSH key for private repos
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Configure private repository access
        run: |
          go env -w GOPRIVATE=github.com/aro-network/*
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Build macOS ARM64
        run: |
          cd core
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            CGO_CFLAGS="-arch arm64" CGO_LDFLAGS="-arch arm64" \
            go build \
              -buildmode=c-shared -trimpath -ldflags="-s -w -buildid=" \
              -o ../plugins/macos/libstudy-arm.dylib ./pkg/libstudy
          ls -lh ../plugins/macos/libstudy-arm.dylib

      - name: Copy library to Flutter FFI directory
        run: |
          mkdir -p apps/aro_client/lib/ffi/macos
          cp plugins/macos/libstudy-arm.dylib apps/aro_client/lib/ffi/macos/
          ls -lh apps/aro_client/lib/ffi/macos/libstudy-arm.dylib

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libstudy-macos-arm64
          path: plugins/macos/

  build-core-macos-amd64:
    needs: prepare
    if: needs.prepare.outputs.build_core == 'true'
    name: Build Core macOS - amd64
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up SSH key for private repos
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Configure private repository access
        run: |
          go env -w GOPRIVATE=github.com/aro-network/*
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Build macOS AMD64
        run: |
          cd core
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64" \
            go build \
              -buildmode=c-shared -trimpath -ldflags="-s -w -buildid=" \
              -o ../plugins/macos/libstudy-amd.dylib ./pkg/libstudy
          ls -lh ../plugins/macos/libstudy-amd.dylib

      - name: Copy library to Flutter FFI directory
        run: |
          mkdir -p apps/aro_client/lib/ffi/macos
          cp plugins/macos/libstudy-amd.dylib apps/aro_client/lib/ffi/macos/
          ls -lh apps/aro_client/lib/ffi/macos/libstudy-amd.dylib

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libstudy-macos-amd64
          path: plugins/macos/
          
  build-core-android:
    needs: prepare
    if: needs.prepare.outputs.build_core == 'true'
    name: Build Core Android ARM64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up SSH key for private repos
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Configure private repository access
        run: |
          go env -w GOPRIVATE=github.com/aro-network/*
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build Android ARM64
        run: |
          cd core
          CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" \
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 go build \
            -buildmode=c-shared -trimpath -ldflags="-s -w -buildid=" \
            -o ../plugins/android/libstudy.so ./pkg/libstudy
          ls -lh ../plugins/android/libstudy.so

      - name: Copy library to Flutter FFI directory
        run: |
          mkdir -p apps/aro_client/lib/ffi/android
          cp plugins/android/libstudy.so apps/aro_client/lib/ffi/android/
          ls -lh apps/aro_client/lib/ffi/android/libstudy.so

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libstudy-android
          path: plugins/android/

  build-core-ios:
    needs: prepare
    if: false # temporarily disabled
    name: Build Core iOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up SSH key for private repos
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Configure private repository access
        run: |
          go env -w GOPRIVATE=github.com/aro-network/*
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Build iOS ARM64
        run: |
          cd core
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
          CGO_CFLAGS="-fembed-bitcode" \
          CGO_LDFLAGS="-fembed-bitcode" \
          SDK=iphoneos go build -buildmode=c-archive \
            -trimpath -ldflags="-s -w -buildid=" \
            -o ../plugins/ios/libstudy.a ./pkg/libstudy
          ls -lh ../plugins/ios/libstudy.a

      - name: Copy library to Flutter FFI directory
        run: |
          mkdir -p apps/aro_client/lib/ffi/ios
          cp plugins/ios/libstudy.a apps/aro_client/lib/ffi/ios/
          ls -lh apps/aro_client/lib/ffi/ios/libstudy.a

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libstudy-ios
          path: plugins/ios/
  # ============================================================
  # Client App Build Jobs
  # ============================================================

  build-windows:
    needs: [prepare, build-core-windows]
    if: needs.prepare.outputs.build_core == 'true'
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Visual Studio Build Tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download Windows DLL if build_core is true
        if: needs.prepare.outputs.build_core == 'true'
        uses: actions/download-artifact@v4
        with:
          name: libstudy-windows
          path: windows-dll

      - name: Copy DLL to project
        if: needs.prepare.outputs.build_core == 'true'
        run: |
          if (Test-Path "windows-dll/libstudy.dll") {
            New-Item -ItemType Directory -Force -Path "${{ env.FLUTTER_DIR }}/lib/ffi/windows"
            Copy-Item "windows-dll/libstudy.dll" -Destination "${{ env.FLUTTER_DIR }}/lib/ffi/windows/" -Force
          }

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          cache: true

      - name: Build Flutter Windows app
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          flutter config --enable-windows-desktop
          flutter precache --windows
          flutter clean
          flutter pub get
          flutter build windows --release

      - name: Copy DLL next to executable
        if: needs.prepare.outputs.build_core == 'true'
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          if (Test-Path "lib/ffi/windows/libstudy.dll") {
            Copy-Item "lib/ffi/windows/libstudy.dll" -Destination "build\windows\x64\runner\Release\" -Force
          }

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
      - name: Create installer script
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          $installerScript = @"
          #define MyAppName "ARO Desktop"
          #define MyAppVersion "1.0.0"
          #define MyAppExeName "aro_desktop.exe"
          #define MyAppMutexName "AROClientMutex"
          #define SourcePath ".\build\windows\x64\runner\Release\"

          [Setup]
          AppId={{12345678-1234-1234-1234-123456789012}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppVerName={#MyAppName} {#MyAppVersion}
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          UninstallDisplayIcon={app}\{#MyAppExeName}
          OutputDir=.\
          OutputBaseFilename=AROClient-Setup
          Compression=lzma
          SolidCompression=yes
          PrivilegesRequired=lowest
          ArchitecturesInstallIn64BitMode=x64
          DisableDirPage=no
          AllowUNCPath=no
          AllowNoIcons=yes
          UninstallFilesDir={app}\uninstall
          CreateUninstallRegKey=yes
          Uninstallable=yes

          ; IMPORTANT: We want to BLOCK uninstall when the app is running.
          ; If CloseApplications is enabled, Windows Restart Manager may close
          ; the app before InitializeUninstall() runs, making it look like
          ; uninstall is allowed.
          CloseApplications=no
          RestartApplications=no

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop icon"; GroupDescription: "Additional icons";
          Name: "quicklaunchicon"; Description: "Create a Quick Launch icon"; GroupDescription: "Additional icons"; Flags: unchecked; OnlyBelowVersion: 6.1
          Name: "startmenu"; Description: "Create Start Menu shortcuts"; GroupDescription: "Additional icons";
          Name: "autostart"; Description: "Run at startup"; GroupDescription: "Launch options"; 
          Name: "contextmenu"; Description: "Add context menu shortcuts"; GroupDescription: "Shell integration";



          [Files]
          Source: "{#SourcePath}\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon; WorkingDir: "{app}"
          Name: "{userappdata}\Microsoft\Internet Explorer\Quick Launch\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: quicklaunchicon
          Name: "{group}\Uninstall {#MyAppName}"; Filename: "{uninstallexe}"

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "{cm:LaunchProgram,{#StringChange(MyAppName, '&', '&&')}}"; Flags: nowait postinstall skipifsilent

          [Registry]
          Root: "HKCU"; Subkey: "Software\Microsoft\Windows\CurrentVersion\Run"; ValueName: "{#MyAppName}"; ValueType: string; ValueData: "{app}\{#MyAppExeName}"; Flags: uninsdeletevalue; Tasks: autostart
          Root: "HKCU"; Subkey: "Software\Classes\*\shell\Open with {#MyAppName}"; ValueType: string; ValueData: "Open with {#MyAppName}"; Tasks: contextmenu; Flags: uninsdeletekey
          Root: "HKCU"; Subkey: "Software\Classes\*\shell\Open with {#MyAppName}\command"; ValueType: string; ValueData: """{app}\{#MyAppExeName}"" ""%1"""; Tasks: contextmenu

          [UninstallDelete]
           ; Remove app data stored under vendor folder (best-effort)
           Type: filesandordirs; Name: "{userappdata}\com.aro\aro_desktop"
           Type: filesandordirs; Name: "{localappdata}\com.aro\aro_desktop"
           Type: filesandordirs; Name: "{userappdata}\com.aro\aro_client"
           Type: filesandordirs; Name: "{localappdata}\com.aro\aro_client"
           ; Remove vendor folder only if empty (avoid deleting other apps' data)
           Type: dirifempty; Name: "{userappdata}\com.aro"
           Type: dirifempty; Name: "{localappdata}\com.aro"
          Type: dirifempty; Name: "{app}"

          [Code]

          const
            MB_TOPMOST_FLAG = 262144;
            MB_ICONINFORMATION_FLAG = 64;

          function MessageBoxW(hWnd: Integer; lpText, lpCaption: string; uType: Cardinal): Integer;
            external 'MessageBoxW@user32.dll stdcall';

          procedure ShowAppRunningCannotUninstall();
          var
            Text: string;
          begin
            Text :=
              '{#MyAppName} is currently running and cannot be uninstalled.' + #13#10 + #13#10 +
              'Please quit/close {#MyAppName} (including the system tray icon), then run the uninstaller again.';

            { Use Win32 MessageBoxW so the message still appears even when the
              uninstaller is launched with /SUPPRESSMSGBOXES (quiet uninstall flows). }
            MessageBoxW(0, Text, '{#MyAppName}', MB_OK or MB_ICONINFORMATION_FLAG or MB_TOPMOST_FLAG);
          end;

          function IsProcessRunning(ProcessName: string): Boolean;
          var
            ResultCode: Integer;
            Cmd: string;
          begin
            Result := False;

            { Locale/encoding-independent check: rely on exit code only }
            Cmd :=
              'tasklist /FI "IMAGENAME eq ' + ProcessName + '" /NH '
              + '| find /I "' + ProcessName + '" >nul';

            if Exec('cmd.exe', '/c ' + Cmd, '', SW_HIDE, ewWaitUntilTerminated, ResultCode) then
              Result := ResultCode = 0;
          end;

          function IsAppRunning(): Boolean;
          begin
            Result :=
              CheckForMutexes('{#MyAppMutexName}') or
              IsProcessRunning('{#MyAppExeName}');
          end;

          function InitializeUninstall(): Boolean;
          begin
            if IsAppRunning() then
            begin
              ShowAppRunningCannotUninstall();
              Result := False;
              exit;
            end;

            Result := True;
          end;
          "@

          Set-Content -Path "aro_installer.iss" -Value $installerScript
      - name: Build installer with Inno Setup
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" aro_installer.iss
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ env.FLUTTER_DIR }}/AROClient-Setup.exe
          if-no-files-found: warn

  build-linux2:
    needs: [prepare, build-core-linux, build-core-linux-arm64]
    if: needs.prepare.outputs.aro_linux == 'true'
    name: Build Tauri Linux Packages (ARO Desktop)
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: "ubuntu:22.04"
            artifact_suffix: "ubuntu"
            bundle_target: "deb"
            tauri_config: "src-tauri/tauri.ubuntu.conf.json"

          - distro: "debian:12"
            artifact_suffix: "debian-12"
            bundle_target: "deb"
            tauri_config: "src-tauri/tauri.debian.conf.json"
          # NOTE: Tauri (gtk-rs/glib-sys 0.18.x) requires GLib >= 2.70.
          # Rocky Linux 8/9 ship GLib < 2.70, so compiling inside those containers fails.
          # `rockylinux:10` is not (currently) published on Docker Hub, so use an EL10-compatible base.
          - distro: "quay.io/centos/centos:stream10"
            artifact_suffix: "centos-stream-10"
            bundle_target: "rpm"
            tauri_config: "src-tauri/tauri.centos-stream10.conf.json"

    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}

    env:
      BUNDLE_TARGET: ${{ matrix.bundle_target }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux x64 Core Library
        uses: actions/download-artifact@v4
        with:
          name: libstudy-linux
          path: plugins/linux

      - name: Download Linux ARM64 Core Library
        uses: actions/download-artifact@v4
        with:
          name: libstudy-linux-arm64
          path: plugins/linux-arm64

      - name: Copy Core Libraries to Tauri Resources
        run: |
          set -euo pipefail
          mkdir -p apps/aro_linux/src-tauri/resources
          cp plugins/linux/libstudy.so apps/aro_linux/src-tauri/resources/
          ls -lh apps/aro_linux/src-tauri/resources/libstudy.so

      - name: Install Dependencies
        run: |
          set -euo pipefail

          retry() {
            local attempts="${1:-5}"
            local sleep_seconds="${2:-3}"
            shift 2 || true
            local n=0
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge "$attempts" ]; then
                return 1
              fi
              sleep $((sleep_seconds * n))
            done
          }

          if [ -f /etc/debian_version ]; then
            retry 5 3 apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
            retry 5 3 env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends --fix-missing \
              git curl jq ca-certificates \
              clang build-essential pkg-config \
              libssl-dev libgtk-3-dev libglib2.0-dev patchelf \
              dpkg fakeroot xz-utils

            if ! env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends --fix-missing libwebkit2gtk-4.1-dev; then
              retry 3 3 env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends --fix-missing libwebkit2gtk-4.0-dev
            fi

            if ! env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends --fix-missing libayatana-appindicator3-dev; then
              retry 3 3 env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends --fix-missing libappindicator3-dev
            fi

            # Set PKG_CONFIG_PATH for Debian-based systems
            export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}" >> $GITHUB_ENV
          elif command -v dnf >/dev/null 2>&1; then
            # Rocky/RHEL often need EPEL for appindicator/ayatana packages.
            dnf install -y dnf-plugins-core || true
            dnf install -y epel-release || true
            # EL8/EL9/EL10: repo name varies (powertools/PowerTools/crb). Not all images have it.
            dnf config-manager --set-enabled crb || true
            dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled PowerTools || true

            dnf -y makecache
            # Some images ship curl-minimal; swap to curl to avoid dependency conflicts.
            if rpm -q curl-minimal >/dev/null 2>&1; then
              dnf -y swap curl-minimal curl --allowerasing || true
            fi

            # pkg-config binary is provided by pkgconf-pkg-config on RHEL/Rocky.
            dnf install -y --allowerasing git curl jq which ca-certificates \
              clang gcc gcc-c++ make pkgconf-pkg-config \
              openssl-devel gtk3-devel glib2 glib2-devel \
              rpm-build

            # Diagnostics: ensure glib-2.0.pc is present and visible to pkg-config.
            command -v pkg-config
            pkg-config --version
            rpm -q glib2 glib2-devel || true
            ls -lah /usr/lib64/pkgconfig/glib-2.0.pc /usr/lib/pkgconfig/glib-2.0.pc 2>/dev/null || true

            # AppIndicator headers (tray).
            # Prefer Ayatana first because modern distros ship it by default and it avoids
            # generating runtime deps on legacy libappindicator3.
            if ! dnf install -y libayatana-appindicator-gtk3-devel; then
              if ! dnf install -y libappindicator-gtk3-devel; then
                echo "ERROR: missing appindicator development package (libappindicator-gtk3-devel or libayatana-appindicator-gtk3-devel)." >&2
                echo "Hint: ensure EPEL is available for this distro." >&2
                exit 1
              fi
            fi

            # Prefer WebKitGTK 4.1 when available; fall back to 4.0 (webkit2gtk3) for older distros.
            if ! dnf install -y webkit2gtk4.1-devel; then
              dnf install -y webkit2gtk3-devel
            fi

            # Set PKG_CONFIG_PATH for Rocky/RHEL-based systems
            export PKG_CONFIG_PATH="/usr/lib64/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}" >> $GITHUB_ENV
          else
            echo "Unsupported distro (no apt-get/dnf)." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/aro_linux/src-tauri/target
          key: ${{ runner.os }}-cargo-tauri-${{ matrix.artifact_suffix }}-${{ hashFiles('apps/aro_linux/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-${{ matrix.artifact_suffix }}-

      - name: Install Tauri CLI
        run: |
          set -euo pipefail
          # NOTE: tauri-cli does not publish every tauri crate patch version (e.g. 2.0.6 doesn't exist on crates.io).
          # Pin to a known-good v2 CLI release to avoid unexpected breaking changes.
          cargo install tauri-cli --version "2.2.7" --locked

      - name: Ensure Debian scripts executable
        run: |
          set -euo pipefail
          chmod +x apps/aro_linux/src-tauri/installer/deb/*

      - name: Ensure RPM scripts executable
        run: |
          set -euo pipefail
          chmod +x apps/aro_linux/src-tauri/installer/rpm/*

      - name: Build Package (${{ matrix.bundle_target }})
        working-directory: apps/aro_linux
        run: |
          set -euo pipefail

          # Tauri CLI only accepts a single --config argument. Generate one merged config
          # (base + common Linux overrides + per-distro overrides) and pass it once.
          jq -s 'reduce .[] as $item ({}; . * $item)' \
            src-tauri/tauri.conf.json \
            src-tauri/tauri.linux.conf.json \
            "${{ matrix.tauri_config }}" \
            > src-tauri/tauri.merged.conf.json

          cargo tauri build --ci --config src-tauri/tauri.merged.conf.json
          ls -lah "src-tauri/target/release/bundle/${BUNDLE_TARGET}" || true

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: aro-desktop-${{ matrix.bundle_target }}-${{ matrix.artifact_suffix }}
          path: apps/aro_linux/src-tauri/target/release/bundle/${{ matrix.bundle_target }}/*.${{ matrix.bundle_target }}
          if-no-files-found: error

  build-flatpak:
    needs: [prepare, build-core-linux, build-core-linux-arm64]
    if: needs.prepare.outputs.build_core == 'true'

    name: Build Flatpak (ARO Desktop)
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux x64 Core Library
        uses: actions/download-artifact@v4
        with:
          name: libstudy-linux
          path: plugins/linux

      - name: Copy Core Library to Tauri Resources
        run: |
          set -euo pipefail
          mkdir -p apps/aro_linux/src-tauri/resources
          cp plugins/linux/libstudy.so apps/aro_linux/src-tauri/resources/libstudy.so
          ls -lah apps/aro_linux/src-tauri/resources/libstudy.so

      - name: Install build dependencies (Ubuntu)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl jq ca-certificates \
            clang build-essential pkg-config \
            libssl-dev libgtk-3-dev libglib2.0-dev patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/aro_linux/src-tauri/target
          key: ${{ runner.os }}-cargo-flatpak-${{ hashFiles('apps/aro_linux/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-flatpak-

      - name: Build Linux binary (release)
        working-directory: apps/aro_linux/src-tauri
        run: |
          set -euo pipefail
          cargo build --release

      - name: Stage Flatpak inputs
        run: |
          set -euo pipefail
          mkdir -p apps/aro_linux/flatpak/stage
          cp apps/aro_linux/src-tauri/target/release/ARO apps/aro_linux/flatpak/stage/ARO
          cp apps/aro_linux/src-tauri/resources/libstudy.so apps/aro_linux/flatpak/stage/libstudy.so

          # Keep the Flatpak source small (avoid copying full Cargo target dir into flatpak-builder).
          rm -rf apps/aro_linux/src-tauri/target

      - name: Install Flatpak tooling
        run: |
          set -euo pipefail
          # flatpak-builder uses eu-strip (elfutils) for stripping/debug split.
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gnome.Platform//47 org.gnome.Sdk//47

      - name: Build Flatpak bundle
        run: |
          set -euo pipefail
          flatpak-builder --force-clean --repo=flatpak-repo --default-branch=stable --arch=x86_64 \
            flatpak-build apps/aro_linux/flatpak/com.aro.ARONetwork.yml
          flatpak build-bundle flatpak-repo aro-desktop.flatpak com.aro.ARONetwork stable \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
          ls -lah aro-desktop.flatpak

      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: aro-desktop-flatpak
          path: aro-desktop.flatpak
          if-no-files-found: error
