name: Build All

on:
  push:
    branches: ["main"]
    paths:
      - "core/**"
      - "apps/aro_client/**"
      - "apps/aro_linux/**"
      - "Dockerfile.*"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "core/**"
      - "apps/aro_client/**"
      - "apps/aro_linux/**"
  workflow_dispatch:

env:
  FLUTTER_DIR: apps/aro_client

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Parse commit tags
    runs-on: ubuntu-latest
    outputs:
      build_core: ${{ steps.flags.outputs.build_core }}
      win: ${{ steps.flags.outputs.win }}
      mac: ${{ steps.flags.outputs.mac }}
      linux: ${{ steps.flags.outputs.linux }}
      aro_linux: ${{ steps.flags.outputs.aro_linux }}
      android: ${{ steps.flags.outputs.android }}
      ios: ${{ steps.flags.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          MSG="$(git log -1 --pretty=%B)"
          echo "Commit message: $MSG"

          if [[ "$MSG" == *"[all]"* ]]; then
            echo "build_core=true" >> $GITHUB_OUTPUT
            echo "linux=true" >> $GITHUB_OUTPUT
            echo "aro_linux=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 检查 core 目录是否有变化，决定是否构建核心库
          # 说明:GitHub Actions 默认是浅克隆，直接使用 HEAD~1 可能不存在。
          CHANGED_FILES=""
          if [[ "${EVENT_NAME}" == "pull_request" && -n "${PR_BASE_SHA}" && -n "${PR_HEAD_SHA}" ]]; then
            git fetch --no-tags --prune --depth=1 origin "${PR_BASE_SHA}" "${PR_HEAD_SHA}" || true
            CHANGED_FILES="$(git diff --name-only "${PR_BASE_SHA}" "${PR_HEAD_SHA}" || true)"
          elif [[ "${EVENT_NAME}" == "push" && -n "${PUSH_BEFORE}" ]]; then
            # 第一次 push 或强推时 before 可能是全 0
            if [[ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
              git fetch --no-tags --prune --depth=1 origin "${PUSH_BEFORE}" "${CURRENT_SHA}" || true
              CHANGED_FILES="$(git diff --name-only "${PUSH_BEFORE}" "${CURRENT_SHA}" || true)"
            else
              CHANGED_FILES="$(git show --name-only --pretty='' "${CURRENT_SHA}" || true)"
            fi
          else
            # workflow_dispatch 等场景：退化为当前提交的变更
            CHANGED_FILES="$(git show --name-only --pretty='' "${CURRENT_SHA}" || true)"
          fi

          if printf '%s\n' "${CHANGED_FILES}" | grep -q '^core/'; then
            echo "build_core=true" >> $GITHUB_OUTPUT
          fi

          # 如果 Flutter 客户端有变更，默认只构建 Linux 客户端（暂时关闭 Win/mac/iOS/Android）
          if printf '%s\n' "${CHANGED_FILES}" | grep -q '^apps/aro_client/'; then
            echo "linux=true" >> $GITHUB_OUTPUT
          fi

          # 如果 Tauri aro_linux 有变更，则构建 Linux 桌面安装包（deb/rpm）
          if printf '%s\n' "${CHANGED_FILES}" | grep -q '^apps/aro_linux/'; then
            echo "aro_linux=true" >> $GITHUB_OUTPUT
          fi

          # 标签仍保留解析，但对应平台构建目前被禁用
          [[ "$MSG" == *"[win]"* ]] && echo "win=true" >> $GITHUB_OUTPUT
          [[ "$MSG" == *"[mac]"* ]] && echo "mac=true" >> $GITHUB_OUTPUT
          [[ "$MSG" == *"[linux]"* ]] && echo "linux=true" >> $GITHUB_OUTPUT
          [[ "$MSG" == *"[aro_linux]"* ]] && echo "aro_linux=true" >> $GITHUB_OUTPUT
          [[ "$MSG" == *"[android]"* ]] && echo "android=true" >> $GITHUB_OUTPUT
          [[ "$MSG" == *"[ios]"* ]] && echo "ios=true" >> $GITHUB_OUTPUT

          exit 0

  # ============================================================
  # Core Library Build Jobs
  # ============================================================

  build-core-linux:
    needs: prepare
    if: needs.prepare.outputs.build_core == 'true'
    # if: false
    name: Build Core Linux x64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Build Linux x64
        run: |
          cd core
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build \
            -buildmode=c-shared -trimpath -ldflags="-s -w -buildid=" \
            -o ../plugins/linux/libstudy.so ./pkg/libstudy
          ls -lh ../plugins/linux/libstudy.so

      - name: Copy library to Flutter FFI directory
        run: |
          mkdir -p apps/aro_client/lib/ffi/linux
          cp plugins/linux/libstudy.so apps/aro_client/lib/ffi/linux/
          ls -lh apps/aro_client/lib/ffi/linux/libstudy.so

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libstudy-linux
          path: plugins/linux/

  build-core-linux-arm64:
    needs: prepare
    if: true
    name: Build Core Linux ARM64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Install ARM64 cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Linux ARM64
        run: |
          cd core
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build \
            -buildmode=c-shared -trimpath -ldflags="-s -w -buildid=" \
            -o ../plugins/linux-arm64/libstudy.so ./pkg/libstudy
          ls -lh ../plugins/linux-arm64/libstudy.so

      - name: Copy library to Flutter FFI directory
        run: |
          mkdir -p apps/aro_client/lib/ffi/linux-arm64
          cp plugins/linux-arm64/libstudy.so apps/aro_client/lib/ffi/linux-arm64/
          ls -lh apps/aro_client/lib/ffi/linux-arm64/libstudy.so

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libstudy-linux-arm64
          path: plugins/linux-arm64/

  build-core-windows:
    needs: prepare
    if: needs.prepare.outputs.build_core == 'true'
    name: Build Core Windows x64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build Windows x64
        run: |
          cd core
          CC=x86_64-w64-mingw32-gcc CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build \
            -buildmode=c-shared -trimpath -ldflags="-s -w -buildid=" \
            -o ../plugins/windows/libstudy.dll ./pkg/libstudy
          ls -lh ../plugins/windows/libstudy.dll

      - name: Copy library to Flutter FFI directory
        run: |
          mkdir -p apps/aro_client/lib/ffi/windows
          cp plugins/windows/libstudy.dll apps/aro_client/lib/ffi/windows/
          ls -lh apps/aro_client/lib/ffi/windows/libstudy.dll

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libstudy-windows
          path: plugins/windows/

  build-core-macos:
    needs: prepare
    if: true
    name: Build Core macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Build macOS ARM64
        run: |
          cd core
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build \
            -buildmode=c-shared -trimpath -ldflags="-s -w -buildid=" \
            -o ../plugins/macos/libstudy.dylib ./pkg/libstudy
          ls -lh ../plugins/macos/libstudy.dylib

      - name: Copy library to Flutter FFI directory
        run: |
          mkdir -p apps/aro_client/lib/ffi/macos
          cp plugins/macos/libstudy.dylib apps/aro_client/lib/ffi/macos/
          ls -lh apps/aro_client/lib/ffi/macos/libstudy.dylib

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libstudy-macos
          path: plugins/macos/

  build-core-android:
    needs: prepare
    if: true # temporarily disabled
    name: Build Core Android ARM64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build Android ARM64
        run: |
          cd core
          CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" \
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 go build \
            -buildmode=c-shared -trimpath -ldflags="-s -w -buildid=" \
            -o ../plugins/android/libstudy.so ./pkg/libstudy
          ls -lh ../plugins/android/libstudy.so

      - name: Copy library to Flutter FFI directory
        run: |
          mkdir -p apps/aro_client/lib/ffi/android
          cp plugins/android/libstudy.so apps/aro_client/lib/ffi/android/
          ls -lh apps/aro_client/lib/ffi/android/libstudy.so

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libstudy-android
          path: plugins/android/

  build-core-ios:
    needs: prepare
    if: false # temporarily disabled
    name: Build Core iOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Build iOS ARM64
        run: |
          cd core
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
          CGO_CFLAGS="-fembed-bitcode" \
          CGO_LDFLAGS="-fembed-bitcode" \
          SDK=iphoneos go build -buildmode=c-archive \
            -trimpath -ldflags="-s -w -buildid=" \
            -o ../plugins/ios/libstudy.a ./pkg/libstudy
          ls -lh ../plugins/ios/libstudy.a

      - name: Copy library to Flutter FFI directory
        run: |
          mkdir -p apps/aro_client/lib/ffi/ios
          cp plugins/ios/libstudy.a apps/aro_client/lib/ffi/ios/
          ls -lh apps/aro_client/lib/ffi/ios/libstudy.a

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libstudy-ios
          path: plugins/ios/

  # ============================================================
  # Client App Build Jobs
  # ============================================================
  build-linux:
    if: false
    needs: [build-core-linux, build-core-linux-arm64]
    name: Build Flutter Linux Packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: "ubuntu:22.04"
            artifact_suffix: "ubuntu-22-04"
          - distro: "debian:11"
            artifact_suffix: "debian-11"
          - distro: "debian:12"
            artifact_suffix: "debian-12"
          - distro: "rockylinux:8"
            artifact_suffix: "rockylinux-8"
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}

    env:
      FLUTTER_DIR: apps/aro_client
      FLUTTER_VERSION: 3.38.5

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux core library (x64)
        if: needs.build-core-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: libstudy-linux
          path: plugins/linux

      - name: Download Linux core library (arm64)
        if: needs.build-core-linux-arm64.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: libstudy-linux-arm64
          path: plugins/linux-arm64

      - name: Copy core libraries into app
        run: |
          set -euo pipefail
          if [ -f plugins/linux/libstudy.so ]; then
            mkdir -p "${FLUTTER_DIR}/lib/ffi/linux"
            cp -f plugins/linux/libstudy.so "${FLUTTER_DIR}/lib/ffi/linux/"
            ls -lh "${FLUTTER_DIR}/lib/ffi/linux/libstudy.so"
          fi

          if [ -f plugins/linux-arm64/libstudy.so ]; then
            mkdir -p "${FLUTTER_DIR}/lib/ffi/linux-arm64"
            cp -f plugins/linux-arm64/libstudy.so "${FLUTTER_DIR}/lib/ffi/linux-arm64/"
            ls -lh "${FLUTTER_DIR}/lib/ffi/linux-arm64/libstudy.so"
          fi

      - name: Install Dependencies
        run: |
          if [ -f /etc/debian_version ]; then
            set -euo pipefail
            retry() {
              local attempts="${1:-5}"
              local sleep_seconds="${2:-3}"
              shift 2 || true
              local n=0
              until "$@"; do
                n=$((n + 1))
                if [ "$n" -ge "$attempts" ]; then
                  return 1
                fi
                sleep $((sleep_seconds * n))
              done
            }

            retry 5 3 apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
            retry 5 3 env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends --fix-missing \
              git curl jq clang cmake ninja-build \
              pkg-config libgtk-3-dev ruby ruby-dev build-essential unzip debianutils
            if ! env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends --fix-missing libwebkit2gtk-4.1-dev; then
              retry 3 3 env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends --fix-missing libwebkit2gtk-4.0-dev
            fi
            # Install appindicator (required by tray_manager plugin)
            if ! env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends --fix-missing libayatana-appindicator3-dev; then
              retry 3 3 env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends --fix-missing libappindicator3-dev
            fi
            retry 5 5 gem install --no-document fpm

          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y epel-release dnf-plugins-core
            dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled PowerTools || true
            dnf -y module reset ruby || true
            dnf -y module enable ruby:3.1 || dnf -y module enable ruby:3.0 || true
            dnf makecache
            dnf install -y git curl jq which gtk3-devel webkit2gtk3-devel libappindicator-gtk3-devel ruby ruby-devel rubygems unzip cmake clang rpm-build
            dnf groupinstall -y "Development Tools"
            if ruby -e 'exit(RUBY_VERSION.to_f >= 2.6 ? 0 : 1)'; then
              gem install --no-document fpm
            else
              gem install --no-document fpm -v 1.15.1
            fi

            # install ninja binary
            if ! command -v ninja &> /dev/null; then
              dnf install -y ninja-build || dnf install -y ninja || true
            fi

            if ! command -v ninja &> /dev/null; then
              curl -L https://github.com/ninja-build/ninja/releases/download/v1.11.1/ninja-linux.zip -o /tmp/ninja.zip
              unzip /tmp/ninja.zip -d /usr/local/bin
              chmod +x /usr/local/bin/ninja
            fi
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Mark Flutter directory as safe for git
        run: |
          set -euo pipefail
          if command -v flutter >/dev/null 2>&1; then
            FLUTTER_BIN="$(command -v flutter)"
            FLUTTER_ROOT="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
            git config --global --add safe.directory "$FLUTTER_ROOT"
          fi
          git config --global --add safe.directory "/__t/flutter/stable-${{ env.FLUTTER_VERSION }}-x64" || true

      # Flutter build
      - name: Build Flutter Linux App
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          flutter config --enable-linux-desktop
          flutter precache --linux
          flutter pub get
          python3 - <<'PY'
          from pathlib import Path

          p = Path("linux/flutter/ephemeral/.plugin_symlinks/desktop_webview_window/linux/CMakeLists.txt")
          if not p.exists():
              raise SystemExit(0)

          s = p.read_text(encoding="utf-8")
          old = "pkg_check_modules(WebKit REQUIRED IMPORTED_TARGET webkit2gtk-4.1)"
          if old not in s:
              raise SystemExit(0)

          new = "\n".join(
              [
                  "pkg_check_modules(WebKit IMPORTED_TARGET webkit2gtk-4.1)",
                  "if (NOT WebKit_FOUND)",
                  "  pkg_check_modules(WebKit REQUIRED IMPORTED_TARGET webkit2gtk-4.0)",
                  "endif()",
              ]
          )
          p.write_text(s.replace(old, new), encoding="utf-8")
          PY
          flutter build linux --release

      - name: Copy FFI Libraries
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          mkdir -p build/linux/x64/release/bundle/lib
          cp lib/ffi/linux/*.so build/linux/x64/release/bundle/lib/ || true

      - name: Verify FFI Libraries
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          set -euo pipefail
          test -f build/linux/x64/release/bundle/lib/libstudy.so
          ls -lh build/linux/x64/release/bundle/lib/libstudy.so

      - name: Create Desktop Entry
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          cat <<EOF > aro-client.desktop
          [Desktop Entry]
          Name=ARO Client
          Exec=/opt/aro-client/aro_linux_client
          Icon=aro-client
          Type=Application
          Categories=Utility;
          EOF

      - name: Package DEB
        if: matrix.distro != 'rockylinux:8'
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | cut -d ' ' -f2 | cut -d '+' -f1)
          chmod +x packaging/linux/postinst.sh packaging/linux/prerm.sh || true
          fpm -s dir -t deb \
            -n aro-client -v "$VERSION" \
            --description "ARO Client" \
            --depends libgtk-3-0 \
            --depends "libwebkit2gtk-4.0-37 | libwebkit2gtk-4.1-0" \
            --after-install packaging/linux/postinst.sh \
            --before-remove packaging/linux/prerm.sh \
            build/linux/x64/release/bundle/=/opt/aro-client/ \
            aro-client.desktop=/usr/share/applications/aro-client.desktop \
            lib/assets/app_icon_1024.png=/usr/share/icons/hicolor/1024x1024/apps/aro-client.png

      - name: Package RPM
        if: matrix.distro == 'rockylinux:8'
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | cut -d ' ' -f2 | cut -d '+' -f1)
          chmod +x packaging/linux/postinst.sh packaging/linux/prerm.sh || true
          fpm -s dir -t rpm \
            -n aro-client -v "$VERSION" \
            --description "ARO Client" \
            --depends gtk3 \
            --depends webkit2gtk3 \
            --after-install packaging/linux/postinst.sh \
            --before-remove packaging/linux/prerm.sh \
            build/linux/x64/release/bundle/=/opt/aro-client/ \
            aro-client.desktop=/usr/share/applications/aro-client.desktop \
            lib/assets/app_icon_1024.png=/usr/share/icons/hicolor/1024x1024/apps/aro-client.png

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.artifact_suffix }}
          path: |
            ${{ env.FLUTTER_DIR }}/*.deb
            ${{ env.FLUTTER_DIR }}/*.rpm

  build-windows:
    needs: [prepare, build-core-windows]
    if: needs.prepare.outputs.build_core == 'true'
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Visual Studio Build Tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download Windows DLL if build_core is true
        if: needs.prepare.outputs.build_core == 'true'
        uses: actions/download-artifact@v4
        with:
          name: libstudy-windows
          path: windows-dll

      - name: Copy DLL to project
        if: needs.prepare.outputs.build_core == 'true'
        run: |
          if (Test-Path "windows-dll/libstudy.dll") {
            New-Item -ItemType Directory -Force -Path "${{ env.FLUTTER_DIR }}/lib/ffi/windows"
            Copy-Item "windows-dll/libstudy.dll" -Destination "${{ env.FLUTTER_DIR }}/lib/ffi/windows/" -Force
          }

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          cache: true

      - name: Build Flutter Windows app
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          flutter config --enable-windows-desktop
          flutter precache --windows
          flutter clean
          flutter pub get
          flutter build windows --release

      - name: Copy DLL next to executable
        if: needs.prepare.outputs.build_core == 'true'
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          if (Test-Path "lib/ffi/windows/libstudy.dll") {
            Copy-Item "lib/ffi/windows/libstudy.dll" -Destination "build\windows\x64\runner\Release\" -Force
          }

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
      - name: Create installer script
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          $installerScript = @"
          #define MyAppName "ARO Desktop"
          #define MyAppVersion "1.0.0"
          #define MyAppExeName "aro_desktop.exe"
          #define SourcePath ".\build\windows\x64\runner\Release\"

          [Setup]
          AppId={{12345678-1234-1234-1234-123456789012}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppVerName={#MyAppName} {#MyAppVersion}
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          UninstallDisplayIcon={app}\{#MyAppExeName}
          OutputDir=.\
          OutputBaseFilename=AROClient-Setup
          Compression=lzma
          SolidCompression=yes
          PrivilegesRequired=lowest
          ArchitecturesInstallIn64BitMode=x64
          DisableDirPage=no
          AllowUNCPath=no
          AllowNoIcons=yes
          UninstallFilesDir={app}\uninstall
          CreateUninstallRegKey=yes
          Uninstallable=yes

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop icon"; GroupDescription: "Additional icons";
          Name: "quicklaunchicon"; Description: "Create a Quick Launch icon"; GroupDescription: "Additional icons"; Flags: unchecked; OnlyBelowVersion: 6.1
          Name: "startmenu"; Description: "Create Start Menu shortcuts"; GroupDescription: "Additional icons";
          Name: "autostart"; Description: "Run at startup"; GroupDescription: "Launch options"; 
          Name: "contextmenu"; Description: "Add context menu shortcuts"; GroupDescription: "Shell integration";



          [Files]
          Source: "{#SourcePath}\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon; WorkingDir: "{app}"
          Name: "{userappdata}\Microsoft\Internet Explorer\Quick Launch\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: quicklaunchicon
          Name: "{group}\Uninstall {#MyAppName}"; Filename: "{uninstallexe}"

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "{cm:LaunchProgram,{#StringChange(MyAppName, '&', '&&')}}"; Flags: nowait postinstall skipifsilent

          [Registry]
          Root: "HKCU"; Subkey: "Software\Microsoft\Windows\CurrentVersion\Run"; ValueName: "{#MyAppName}"; ValueType: string; ValueData: "{app}\{#MyAppExeName}"; Flags: uninsdeletevalue; Tasks: autostart
          Root: "HKCU"; Subkey: "Software\Classes\*\shell\Open with {#MyAppName}"; ValueType: string; ValueData: "Open with {#MyAppName}"; Tasks: contextmenu; Flags: uninsdeletekey
          Root: "HKCU"; Subkey: "Software\Classes\*\shell\Open with {#MyAppName}\command"; ValueType: string; ValueData: """{app}\{#MyAppExeName}"" ""%1"""; Tasks: contextmenu

          [UninstallDelete]
          Type: dirifempty; Name: "{app}"
          "@

          Set-Content -Path "aro_installer.iss" -Value $installerScript
      - name: Build installer with Inno Setup
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" aro_installer.iss
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ env.FLUTTER_DIR }}/AROClient-Setup.exe
          if-no-files-found: warn


  build-linux2:
    needs: prepare
    if: needs.prepare.outputs.aro_linux == 'true'
    name: Build Tauri Linux Packages (ARO Desktop)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build deb on Debian 11 for minimum runtime compatibility (Debian 11+).
          - distro: "debian:11"
            artifact_suffix: "debian-11"
            bundle_target: "deb"
          - distro: "rockylinux:8"
            artifact_suffix: "rockylinux-8"
            bundle_target: "rpm"
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}

    env:
      BUNDLE_TARGET: ${{ matrix.bundle_target }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          set -euo pipefail

          retry() {
            local attempts="${1:-5}"
            local sleep_seconds="${2:-3}"
            shift 2 || true
            local n=0
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge "$attempts" ]; then
                return 1
              fi
              sleep $((sleep_seconds * n))
            done
          }

          if [ -f /etc/debian_version ]; then
            retry 5 3 apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
            retry 5 3 env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends --fix-missing \
              git curl jq ca-certificates \
              clang build-essential pkg-config \
              libssl-dev libgtk-3-dev libglib2.0-dev patchelf \
              dpkg fakeroot xz-utils
            
            # Ensure glib development files are properly installed
            echo "Ensuring glib2.0-dev installation..."
            retry 3 3 env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install --reinstall -y libglib2.0-dev || true

            if ! env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends --fix-missing libwebkit2gtk-4.1-dev; then
              retry 3 3 env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends --fix-missing libwebkit2gtk-4.0-dev
            fi

            if ! env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends --fix-missing libayatana-appindicator3-dev; then
              retry 3 3 env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends --fix-missing libappindicator3-dev
            fi

            # Set PKG_CONFIG_PATH for Debian-based systems
            export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}" >> $GITHUB_ENV

            # Verify critical pkg-config files exist
            echo "Verifying pkg-config files..."
            pkg-config --exists glib-2.0 || {
              echo "ERROR: glib-2.0.pc not found after installing libglib2.0-dev" >&2
              echo "Installed libglib2.0-dev files:"
              dpkg -L libglib2.0-dev 2>/dev/null | head -20 || true
              echo "Available pkg-config files:"
              find /usr/lib /usr/share -name '*.pc' 2>/dev/null | grep -i glib | head -10 || true
              exit 1
            }
            echo "glib-2.0 version: $(pkg-config --modversion glib-2.0)"
          elif command -v dnf >/dev/null 2>&1; then
            # Rocky/RHEL often need EPEL for appindicator/ayatana packages.
            dnf install -y epel-release dnf-plugins-core || dnf install -y epel-release || true
            dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled PowerTools || true

            dnf -y makecache
            dnf install -y git curl jq which ca-certificates \
              clang gcc gcc-c++ make pkgconfig \
              openssl-devel gtk3-devel glib2-devel \
              rpm-build

            # AppIndicator headers (tray). Try legacy libappindicator first, then ayatana.
            if ! dnf install -y libappindicator-gtk3-devel; then
              if ! dnf install -y libayatana-appindicator-gtk3-devel; then
                echo "ERROR: missing appindicator development package (libappindicator-gtk3-devel or libayatana-appindicator-gtk3-devel)." >&2
                echo "Hint: ensure EPEL is available for this distro." >&2
                exit 1
              fi
            fi

            # Prefer WebKitGTK 4.1 when available; fall back to 4.0 (webkit2gtk3) for older distros.
            if ! dnf install -y webkit2gtk4.1-devel; then
              dnf install -y webkit2gtk3-devel
            fi

            # Set PKG_CONFIG_PATH for Rocky/RHEL-based systems
            export PKG_CONFIG_PATH="/usr/lib64/pkgconfig:/usr/share/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}" >> $GITHUB_ENV
          else
            echo "Unsupported distro (no apt-get/dnf)." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/aro_linux/src-tauri/target
          key: ${{ runner.os }}-cargo-tauri-${{ matrix.artifact_suffix }}-${{ hashFiles('apps/aro_linux/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-${{ matrix.artifact_suffix }}-

      - name: Build Core Library (Linux x64)
        run: |
          set -euo pipefail
          cd core
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build \
            -buildmode=c-shared -trimpath -ldflags="-s -w -buildid=" \
            -o ../plugins/linux/libstudy.so ./pkg/libstudy
          ls -lh ../plugins/linux/libstudy.so

      - name: Copy Core Library to Tauri Resources
        run: |
          set -euo pipefail
          mkdir -p apps/aro_linux/src/resources
          cp plugins/linux/libstudy.so apps/aro_linux/src/resources/
          ls -lh apps/aro_linux/src/resources/libstudy.so

      - name: Install Tauri CLI
        run: |
          set -euo pipefail
          cargo install tauri-cli --version "^2"

      - name: Verify pkg-config after dependencies
        run: |
          echo "=== Checking pkg-config setup ==="
          pkg-config --version
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          
          # Try to find glib-2.0.pc
          echo "Looking for glib-2.0.pc files..."
          find /usr/lib /usr/share -name "glib-2.0.pc" 2>/dev/null || echo "No glib-2.0.pc found in standard locations"
          
          # List files in pkg-config directories
          echo ""
          echo "Files in /usr/lib/x86_64-linux-gnu/pkgconfig (first 10):"
          ls -la /usr/lib/x86_64-linux-gnu/pkgconfig 2>/dev/null | grep glib | head -10 || echo "Directory not accessible"
          
          echo ""
          echo "Files in /usr/lib/pkgconfig (glib related):"
          ls -la /usr/lib/pkgconfig 2>/dev/null | grep glib | head -10 || echo "Directory not accessible"
          
          # Verify installation
          echo ""
          echo "Checking libglib2.0-dev installation:"
          dpkg -l | grep libglib2.0 || echo "libglib2.0-dev not found in dpkg list"

      - name: Build Package (${{ matrix.bundle_target }})
        working-directory: apps/aro_linux
        run: |
          set -euo pipefail
          
          # Set PKG_CONFIG_PATH for build step
          export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:${PKG_CONFIG_PATH:-}"
          echo "Build PKG_CONFIG_PATH=$PKG_CONFIG_PATH"

          # Create symlinks for missing library versions (Debian 11 compatibility)
          # This allows the linker to find webkit2gtk-4.1, javascriptcoregtk-4.1, soup-3.0
          # by linking to the actual 4.0/2.4 versions that exist
          LIBDIR="/usr/lib/x86_64-linux-gnu"
          if [ -d "$LIBDIR" ]; then
            # webkit2gtk 4.1 -> 4.0
            for lib in "$LIBDIR"/libwebkit2gtk-4.so* "$LIBDIR"/libwebkit2gtk-4.0* ; do
              if [ -e "$lib" ]; then
                basename_lib="$(basename "$lib")"
                link_name="${basename_lib/-4.0/-4.1}"
                if [ "$link_name" != "$basename_lib" ]; then
                  echo "Creating symlink: $LIBDIR/$link_name -> $basename_lib"
                  ln -sf "$basename_lib" "$LIBDIR/$link_name" || true
                fi
              fi
            done
            
            # javascriptcoregtk 4.1 -> 4.0
            for lib in "$LIBDIR"/libjavascriptcoregtk-4* ; do
              if [ -e "$lib" ]; then
                basename_lib="$(basename "$lib")"
                link_name="${basename_lib/-4.0/-4.1}"
                if [ "$link_name" != "$basename_lib" ]; then
                  echo "Creating symlink: $LIBDIR/$link_name -> $basename_lib"
                  ln -sf "$basename_lib" "$LIBDIR/$link_name" || true
                fi
              fi
            done
            
            # libsoup 3.0 -> 2.4
            for lib in "$LIBDIR"/libsoup-2.4* ; do
              if [ -e "$lib" ]; then
                basename_lib="$(basename "$lib")"
                link_name="${basename_lib/2.4/3.0}"
                if [ "$link_name" != "$basename_lib" ]; then
                  echo "Creating symlink: $LIBDIR/$link_name -> $basename_lib"
                  ln -sf "$basename_lib" "$LIBDIR/$link_name" || true
                fi
              fi
            done
          fi

          # Debian 11 compatibility: provide override .pc files with version >= 2.70
          OVERRIDE_PCDIR="/tmp/pkgconfig-overrides"
          mkdir -p "$OVERRIDE_PCDIR"
          for pkg in glib-2.0 gobject-2.0 gio-2.0; do
            echo "Generating override for $pkg"
            cflags="$(pkg-config --cflags "$pkg")"
            libs="$(pkg-config --libs "$pkg")"
            printf '%s\n' \
              "prefix=/usr" \
              "exec_prefix=\${prefix}" \
              "libdir=/usr/lib/x86_64-linux-gnu" \
              "includedir=/usr/include" \
              "" \
              "Name: ${pkg}" \
              "Description: override pc for ${pkg}" \
              "Version: 2.70" \
              "Libs: ${libs}" \
              "Cflags: ${cflags}" \
              > "$OVERRIDE_PCDIR/$pkg.pc"
          done

          # WebKitGTK/JSC: Debian 11 provides 4.0; create 4.1 aliases if missing
          # We need to replace the library names in the Libs field to point to actual libraries
          if ! pkg-config --exists "webkit2gtk-4.1"; then
            if pkg-config --exists "webkit2gtk-4.0"; then
              echo "Creating override for webkit2gtk-4.1 using webkit2gtk-4.0"
              cflags="$(pkg-config --cflags "webkit2gtk-4.0")"
              libs="$(pkg-config --libs "webkit2gtk-4.0" | sed 's/-lwebkit2gtk-4\.0/-lwebkit2gtk-4.0/g')"
              printf '%s\n' \
                "prefix=/usr" \
                "exec_prefix=\${prefix}" \
                "libdir=/usr/lib/x86_64-linux-gnu" \
                "includedir=/usr/include" \
                "" \
                "Name: webkit2gtk-4.1" \
                "Description: override pc for webkit2gtk-4.1" \
                "Version: 4.1" \
                "Libs: ${libs}" \
                "Cflags: ${cflags}" \
                > "$OVERRIDE_PCDIR/webkit2gtk-4.1.pc"
            fi
          fi

          if ! pkg-config --exists "javascriptcoregtk-4.1"; then
            if pkg-config --exists "javascriptcoregtk-4.0"; then
              echo "Creating override for javascriptcoregtk-4.1 using javascriptcoregtk-4.0"
              cflags="$(pkg-config --cflags "javascriptcoregtk-4.0")"
              libs="$(pkg-config --libs "javascriptcoregtk-4.0" | sed 's/-ljavascriptcoregtk-4\.0/-ljavascriptcoregtk-4.0/g')"
              printf '%s\n' \
                "prefix=/usr" \
                "exec_prefix=\${prefix}" \
                "libdir=/usr/lib/x86_64-linux-gnu" \
                "includedir=/usr/include" \
                "" \
                "Name: javascriptcoregtk-4.1" \
                "Description: override pc for javascriptcoregtk-4.1" \
                "Version: 4.1" \
                "Libs: ${libs}" \
                "Cflags: ${cflags}" \
                > "$OVERRIDE_PCDIR/javascriptcoregtk-4.1.pc"
            fi
          fi

          # libsoup3: Debian 11 provides libsoup-2.4; create libsoup-3.0 alias if missing
          if ! pkg-config --exists "libsoup-3.0"; then
            if pkg-config --exists "libsoup-2.4"; then
              echo "Creating override for libsoup-3.0 using libsoup-2.4"
              cflags="$(pkg-config --cflags "libsoup-2.4")"
              libs="$(pkg-config --libs "libsoup-2.4" | sed 's/-lsoup-2\.4/-lsoup-2.4/g')"
              printf '%s\n' \
                "prefix=/usr" \
                "exec_prefix=\${prefix}" \
                "libdir=/usr/lib/x86_64-linux-gnu" \
                "includedir=/usr/include" \
                "" \
                "Name: libsoup-3.0" \
                "Description: override pc for libsoup-3.0" \
                "Version: 3.0" \
                "Libs: ${libs}" \
                "Cflags: ${cflags}" \
                > "$OVERRIDE_PCDIR/libsoup-3.0.pc"
            fi
          fi
          export PKG_CONFIG_PATH="$OVERRIDE_PCDIR:$PKG_CONFIG_PATH"
          
          # Verify glib-2.0 can be found
          pkg-config --exists glib-2.0 || {
            echo "ERROR: glib-2.0.pc not found during build" >&2
            echo "Attempting to find it..."
            find / -name "glib-2.0.pc" 2>/dev/null | head -5 || true
            exit 1
          }
          
          CONFIG_JSON="$(jq -nc --arg t "${BUNDLE_TARGET}" '{bundle:{targets:[$t]}}')"
          cargo tauri build --ci --config "$CONFIG_JSON"
          ls -lah "src-tauri/target/release/bundle/${BUNDLE_TARGET}" || true

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: aro-desktop-${{ matrix.bundle_target }}-${{ matrix.artifact_suffix }}
          path: apps/aro_linux/src-tauri/target/release/bundle/${{ matrix.bundle_target }}/*.${{ matrix.bundle_target }}
          if-no-files-found: error

