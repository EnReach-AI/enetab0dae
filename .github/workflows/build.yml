name: Build All

on:
  push:
    branches: ["main"]
    paths:
      - "core/**"
      - "apps/aro_client/**"
      - "apps/aro_linux/**"
      - "Dockerfile.*"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "core/**"
      - "apps/aro_client/**"
      - "apps/aro_linux/**"
  workflow_dispatch:

env:
  FLUTTER_DIR: apps/aro_client

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Parse commit tags
    runs-on: ubuntu-latest
    outputs:
      build_core: ${{ steps.flags.outputs.build_core }}
      win: ${{ steps.flags.outputs.win }}
      mac: ${{ steps.flags.outputs.mac }}
      linux: ${{ steps.flags.outputs.linux }}
      aro_linux: ${{ steps.flags.outputs.aro_linux }}
      android: ${{ steps.flags.outputs.android }}
      ios: ${{ steps.flags.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          MSG="$(git log -1 --pretty=%B)"
          echo "Commit message: $MSG"

          if [[ "$MSG" == *"[all]"* ]]; then
            echo "build_core=true" >> $GITHUB_OUTPUT
            echo "linux=true" >> $GITHUB_OUTPUT
            echo "aro_linux=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED_FILES=""
          if [[ "${EVENT_NAME}" == "pull_request" && -n "${PR_BASE_SHA}" && -n "${PR_HEAD_SHA}" ]]; then
            git fetch --no-tags --prune --depth=1 origin "${PR_BASE_SHA}" "${PR_HEAD_SHA}" || true
            CHANGED_FILES="$(git diff --name-only "${PR_BASE_SHA}" "${PR_HEAD_SHA}" || true)"
          elif [[ "${EVENT_NAME}" == "push" && -n "${PUSH_BEFORE}" ]]; then
            if [[ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
              git fetch --no-tags --prune --depth=1 origin "${PUSH_BEFORE}" "${CURRENT_SHA}" || true
              CHANGED_FILES="$(git diff --name-only "${PUSH_BEFORE}" "${CURRENT_SHA}" || true)"
            else
              CHANGED_FILES="$(git show --name-only --pretty='' "${CURRENT_SHA}" || true)"
            fi
          else
            CHANGED_FILES="$(git show --name-only --pretty='' "${CURRENT_SHA}" || true)"
          fi

          if printf '%s\n' "${CHANGED_FILES}" | grep -q '^core/'; then
            echo "build_core=true" >> $GITHUB_OUTPUT
          fi

          if printf '%s\n' "${CHANGED_FILES}" | grep -q '^apps/aro_client/'; then
            echo "linux=true" >> $GITHUB_OUTPUT
          fi

          if printf '%s\n' "${CHANGED_FILES}" | grep -q '^apps/aro_linux/'; then
            echo "aro_linux=true" >> $GITHUB_OUTPUT
          fi

          [[ "$MSG" == *"[win]"* ]] && echo "win=true" >> $GITHUB_OUTPUT
          [[ "$MSG" == *"[mac]"* ]] && echo "mac=true" >> $GITHUB_OUTPUT
          [[ "$MSG" == *"[linux]"* ]] && echo "linux=true" >> $GITHUB_OUTPUT
          [[ "$MSG" == *"[aro_linux]"* ]] && echo "aro_linux=true" >> $GITHUB_OUTPUT
          [[ "$MSG" == *"[android]"* ]] && echo "android=true" >> $GITHUB_OUTPUT
          [[ "$MSG" == *"[ios]"* ]] && echo "ios=true" >> $GITHUB_OUTPUT

          exit 0

  # ============================================================
  # Core Library Build Jobs
  # ============================================================

  build-core-linux:
    needs: prepare
    if: needs.prepare.outputs.build_core == 'true'
    # if: false
    name: Build Core Linux x64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up SSH key for private repos
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Configure private repository access
        run: |
          go env -w GOPRIVATE=github.com/aro-network/*
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Build Linux x64
        run: |
          cd core
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build \
            -buildmode=c-shared -trimpath -ldflags="-s -w -buildid=" \
            -o ../plugins/linux/libstudy.so ./pkg/libstudy
          ls -lh ../plugins/linux/libstudy.so

      - name: Copy library to Flutter FFI directory
        run: |
          mkdir -p apps/aro_client/lib/ffi/linux
          cp plugins/linux/libstudy.so apps/aro_client/lib/ffi/linux/
          ls -lh apps/aro_client/lib/ffi/linux/libstudy.so

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libstudy-linux
          path: plugins/linux/

  build-core-linux-arm64:
    needs: prepare
    if: needs.prepare.outputs.build_core == 'true'
    name: Build Core Linux ARM64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up SSH key for private repos
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Configure private repository access
        run: |
          go env -w GOPRIVATE=github.com/aro-network/*
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Install ARM64 cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Linux ARM64
        run: |
          cd core
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build \
            -buildmode=c-shared -trimpath -ldflags="-s -w -buildid=" \
            -o ../plugins/linux-arm64/libstudy.so ./pkg/libstudy
          ls -lh ../plugins/linux-arm64/libstudy.so

      - name: Copy library to Flutter FFI directory
        run: |
          mkdir -p apps/aro_client/lib/ffi/linux-arm64
          cp plugins/linux-arm64/libstudy.so apps/aro_client/lib/ffi/linux-arm64/
          ls -lh apps/aro_client/lib/ffi/linux-arm64/libstudy.so

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libstudy-linux-arm64
          path: plugins/linux-arm64/

  build-core-windows:
    needs: prepare
    if: needs.prepare.outputs.build_core == 'true'
    name: Build Core Windows x64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up SSH key for private repos
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Configure private repository access
        run: |
          go env -w GOPRIVATE=github.com/aro-network/*
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build Windows x64
        run: |
          cd core
          CC=x86_64-w64-mingw32-gcc CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build \
            -buildmode=c-shared -trimpath \
            -ldflags="-s -w -buildid= -extldflags '-static-libgcc'" \
            -o ../plugins/windows/libstudy.dll ./pkg/libstudy
          ls -lh ../plugins/windows/libstudy.dll

      - name: Copy library to Flutter FFI directory
        run: |
          mkdir -p apps/aro_client/lib/ffi/windows
          cp plugins/windows/libstudy.dll apps/aro_client/lib/ffi/windows/
          ls -lh apps/aro_client/lib/ffi/windows/libstudy.dll

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libstudy-windows
          path: plugins/windows/

  build-core-windows-arm64:
    needs: prepare
    if: needs.prepare.outputs.build_core == 'true'
    name: Build Core Windows ARM64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up SSH key for private repos
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Configure private repository access
        run: |
          go env -w GOPRIVATE=github.com/aro-network/*
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Install Zig (ARM64 cross-compiler)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: Build Windows ARM64
        run: |
          # Create zig cc wrapper for Go CGO compatibility
          # Zig handles MinGW/GCC runtime internally, so filter out those linker flags
          cat > /tmp/zcc-aarch64-w64 <<'WRAPPER'
          #!/bin/bash
          args=()
          for arg in "$@"; do
            case "$arg" in
              -lgcc|-lgcc_s|-lgcc_eh|-lmingwex|-lmingw32|-lmsvcrt|-lucrtbase|-lpthread)
                ;;
              *)
                args+=("$arg")
                ;;
            esac
          done
          exec zig cc -target aarch64-windows-gnu "${args[@]}"
          WRAPPER
          chmod +x /tmp/zcc-aarch64-w64

          cd core
          CC=/tmp/zcc-aarch64-w64 CGO_ENABLED=1 GOOS=windows GOARCH=arm64 go build \
            -buildmode=c-shared -trimpath \
            -ldflags="-s -w -buildid=" \
            -o ../plugins/windows-arm64/libstudy.dll ./pkg/libstudy
          ls -lh ../plugins/windows-arm64/libstudy.dll

      - name: Copy library to Flutter FFI directory
        run: |
          mkdir -p apps/aro_client/lib/ffi/windows-arm64
          cp plugins/windows-arm64/libstudy.dll apps/aro_client/lib/ffi/windows-arm64/
          ls -lh apps/aro_client/lib/ffi/windows-arm64/libstudy.dll

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libstudy-windows-arm64
          path: plugins/windows-arm64/

  build-core-macos-arm64:
    needs: prepare
    if: needs.prepare.outputs.build_core == 'true'
    name: Build Core macOS - arm64
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up SSH key for private repos
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Configure private repository access
        run: |
          go env -w GOPRIVATE=github.com/aro-network/*
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Build macOS ARM64
        run: |
          cd core
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            CGO_CFLAGS="-arch arm64" CGO_LDFLAGS="-arch arm64" \
            go build \
              -buildmode=c-shared -trimpath -ldflags="-s -w -buildid=" \
              -o ../plugins/macos/libstudy-arm.dylib ./pkg/libstudy
          ls -lh ../plugins/macos/libstudy-arm.dylib

      - name: Copy library to Flutter FFI directory
        run: |
          mkdir -p apps/aro_client/lib/ffi/macos
          cp plugins/macos/libstudy-arm.dylib apps/aro_client/lib/ffi/macos/
          ls -lh apps/aro_client/lib/ffi/macos/libstudy-arm.dylib

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libstudy-macos-arm64
          path: plugins/macos/

  build-core-macos-amd64:
    needs: prepare
    if: needs.prepare.outputs.build_core == 'true'
    name: Build Core macOS - amd64
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up SSH key for private repos
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Configure private repository access
        run: |
          go env -w GOPRIVATE=github.com/aro-network/*
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Build macOS AMD64
        run: |
          cd core
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64" \
            go build \
              -buildmode=c-shared -trimpath -ldflags="-s -w -buildid=" \
              -o ../plugins/macos/libstudy-amd.dylib ./pkg/libstudy
          ls -lh ../plugins/macos/libstudy-amd.dylib

      - name: Copy library to Flutter FFI directory
        run: |
          mkdir -p apps/aro_client/lib/ffi/macos
          cp plugins/macos/libstudy-amd.dylib apps/aro_client/lib/ffi/macos/
          ls -lh apps/aro_client/lib/ffi/macos/libstudy-amd.dylib

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libstudy-macos-amd64
          path: plugins/macos/
          
  build-core-android:
    needs: prepare
    if: needs.prepare.outputs.build_core == 'true'
    name: Build Core Android ARM64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up SSH key for private repos
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Configure private repository access
        run: |
          go env -w GOPRIVATE=github.com/aro-network/*
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build Android ARM64
        run: |
          cd core
          CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" \
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 go build \
            -buildmode=c-shared -trimpath -ldflags="-s -w -buildid= -extldflags '-Wl,-z,max-page-size=16384'" \
            -o ../plugins/android/libstudy.so ./pkg/libstudy
          ls -lh ../plugins/android/libstudy.so

      - name: Copy library to Flutter FFI directory
        run: |
          mkdir -p apps/aro_client/lib/ffi/android
          cp plugins/android/libstudy.so apps/aro_client/lib/ffi/android/
          ls -lh apps/aro_client/lib/ffi/android/libstudy.so

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libstudy-android
          path: plugins/android/

  build-core-ios:
    needs: prepare
    if: false # temporarily disabled
    name: Build Core iOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up SSH key for private repos
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Configure private repository access
        run: |
          go env -w GOPRIVATE=github.com/aro-network/*
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Build iOS ARM64
        run: |
          cd core
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
          CGO_CFLAGS="-fembed-bitcode" \
          CGO_LDFLAGS="-fembed-bitcode" \
          SDK=iphoneos go build -buildmode=c-archive \
            -trimpath -ldflags="-s -w -buildid=" \
            -o ../plugins/ios/libstudy.a ./pkg/libstudy
          ls -lh ../plugins/ios/libstudy.a

      - name: Copy library to Flutter FFI directory
        run: |
          mkdir -p apps/aro_client/lib/ffi/ios
          cp plugins/ios/libstudy.a apps/aro_client/lib/ffi/ios/
          ls -lh apps/aro_client/lib/ffi/ios/libstudy.a

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libstudy-ios
          path: plugins/ios/
  # ============================================================
  # Client App Build Jobs
  # ============================================================

  build-windows:
    needs: [prepare, build-core-windows, build-core-windows-arm64]
    if: needs.prepare.outputs.build_core == 'true'
    name: Build Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            msvc_arch: ""
            core_artifact: libstudy-windows
            release_dir: build\windows\x64\runner\Release
            crt_arch: x64
            vswhere_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
            launcher_machine: X64
            vc_redist_label: x64
            artifact_name: windows-x64-build
          - arch: arm64
            runner: windows-11-arm
            msvc_arch: ""
            core_artifact: libstudy-windows-arm64
            release_dir: build\windows\arm64\runner\Release
            crt_arch: arm64
            vswhere_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
            launcher_machine: ARM64
            vc_redist_label: arm64
            artifact_name: windows-arm64-build

    steps:
      - uses: actions/checkout@v4

      - name: Install Visual Studio Build Tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch || 'x64' }}

      - name: Download Windows DLL
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.core_artifact }}
          path: windows-dll

      - name: Copy DLL to project
        run: |
          if (Test-Path "windows-dll/libstudy.dll") {
            New-Item -ItemType Directory -Force -Path "${{ env.FLUTTER_DIR }}/lib/ffi/windows"
            Copy-Item "windows-dll/libstudy.dll" -Destination "${{ env.FLUTTER_DIR }}/lib/ffi/windows/" -Force
          }

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          cache: true

      - name: Build Flutter Windows app
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          flutter config --enable-windows-desktop
          flutter precache --windows
          flutter clean
          flutter pub get

          # Patch sentry_flutter native SDK (crashpad zlib clone fails on GH Actions)
          $pubCache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { "$env:LOCALAPPDATA\Pub\Cache" }
          $sentryPkg = Get-ChildItem -Path "$pubCache\hosted\pub.dev" -Directory -Filter "sentry_flutter-*" |
                       Sort-Object Name -Descending | Select-Object -First 1
          if ($sentryPkg) {
            $cmakePath = Join-Path $sentryPkg.FullName "windows\CMakeLists.txt"
            if (Test-Path $cmakePath) {
              $stub = @"
          cmake_minimum_required(VERSION 3.14)
          file(WRITE "`${CMAKE_CURRENT_BINARY_DIR}/sentry_stub.c" "__declspec(dllexport) void sentry_stub(void) {}")
          add_library(sentry_flutter_plugin SHARED "`${CMAKE_CURRENT_BINARY_DIR}/sentry_stub.c")
          target_include_directories(sentry_flutter_plugin PUBLIC "`${CMAKE_CURRENT_LIST_DIR}")
          set(sentry_flutter_bundled_libraries "" PARENT_SCOPE)
          "@
              Set-Content -Path $cmakePath -Value $stub
              Write-Host "Patched $cmakePath (sentry native SDK disabled)"
            }
          }

          flutter build windows --release

      - name: Copy DLL next to executable
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          if (Test-Path "lib/ffi/windows/libstudy.dll") {
            Copy-Item "lib/ffi/windows/libstudy.dll" -Destination "${{ matrix.release_dir }}\" -Force
          }

      - name: Bundle VC++ Runtime DLLs (app-local deployment)
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          $releaseDir = "${{ matrix.release_dir }}"

          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -requires ${{ matrix.vswhere_component }} `
            -property installationPath 2>$null
          if (-not $vsPath) {
            $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -property installationPath 2>$null
          }
          if (-not $vsPath) {
            Write-Host "WARNING: Could not locate Visual Studio installation" -ForegroundColor Yellow
            exit 0
          }

          $redistBase = Join-Path $vsPath "VC\Redist\MSVC"
          if (-not (Test-Path $redistBase)) {
            Write-Host "WARNING: VC++ Redist directory not found" -ForegroundColor Yellow
            exit 0
          }
          $latestVer = Get-ChildItem -Path $redistBase -Directory |
                       Where-Object { $_.Name -match '^\d+\.\d+' } |
                       Sort-Object Name -Descending | Select-Object -First 1
          $crtDir = Join-Path $latestVer.FullName "${{ matrix.crt_arch }}\Microsoft.VC143.CRT"
          if (-not (Test-Path $crtDir)) {
            $crtDir = Join-Path $latestVer.FullName "${{ matrix.crt_arch }}\Microsoft.VC142.CRT"
          }
          if (-not (Test-Path $crtDir)) {
            Write-Host "WARNING: CRT directory not found" -ForegroundColor Yellow
            exit 0
          }

          Write-Host "Copying CRT DLLs from: $crtDir" -ForegroundColor Green
          $crtDlls = @(
            'vcruntime140.dll', 'vcruntime140_1.dll',
            'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll',
            'concrt140.dll', 'vccorlib140.dll'
          )
          $copied = 0
          foreach ($dll in $crtDlls) {
            $src = Join-Path $crtDir $dll
            if (Test-Path $src) {
              Copy-Item $src -Destination $releaseDir -Force
              Write-Host "  Bundled: $dll" -ForegroundColor Green
              $copied++
            }
          }
          Write-Host "Bundled $copied CRT DLLs into $releaseDir"

      - name: Build pre-launch checker
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          $launcherSrc = @'
          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>
          #include <shellapi.h>
          #include <stdio.h>

          static const char* REQUIRED_DLLS[] = {
              "vcruntime140.dll",
              "vcruntime140_1.dll",
              "msvcp140.dll",
              NULL
          };

          int WINAPI WinMain(HINSTANCE hInst, HINSTANCE hPrev, LPSTR lpCmd, int nShow) {
              char missing[2048] = {0};
              int nmiss = 0;
              for (int i = 0; REQUIRED_DLLS[i]; i++) {
                  HMODULE h = LoadLibraryA(REQUIRED_DLLS[i]);
                  if (h) { FreeLibrary(h); }
                  else {
                      if (nmiss > 0) strcat_s(missing, sizeof(missing), "\n");
                      strcat_s(missing, sizeof(missing), "  - ");
                      strcat_s(missing, sizeof(missing), REQUIRED_DLLS[i]);
                      nmiss++;
                  }
              }
              if (nmiss > 0) {
                  char msg[4096];
                  sprintf_s(msg, sizeof(msg),
                      "ARO Desktop cannot start because the following DLLs are missing:\n\n"
                      "%s\n\n"
                      "Please install the Visual C++ 2015-2022 Redistributable:\n"
                      "https://aka.ms/vs/17/release/vc_redist.${{ matrix.vc_redist_label }}.exe\n\n"
                      "Or run:  winget install Microsoft.VCRedist.2015+.${{ matrix.vc_redist_label }}",
                      missing);
                  int r = MessageBoxA(NULL, msg, "ARO Desktop - Missing Dependencies",
                                      MB_OKCANCEL | MB_ICONERROR);
                  if (r == IDOK) {
                      ShellExecuteA(NULL, "open",
                                    "https://aka.ms/vs/17/release/vc_redist.${{ matrix.vc_redist_label }}.exe",
                                    NULL, NULL, SW_SHOWNORMAL);
                  }
                  return 1;
              }
              char dir[MAX_PATH];
              GetModuleFileNameA(NULL, dir, MAX_PATH);
              char* slash = strrchr(dir, '\\');
              if (slash) *(slash + 1) = 0;
              char exe[MAX_PATH];
              sprintf_s(exe, sizeof(exe), "%saro_desktop.exe", dir);
              STARTUPINFOA si = { sizeof(si) };
              PROCESS_INFORMATION pi;
              if (CreateProcessA(exe, GetCommandLineA(), NULL, NULL, FALSE, 0, NULL, dir, &si, &pi)) {
                  CloseHandle(pi.hProcess);
                  CloseHandle(pi.hThread);
              }
              return 0;
          }
          '@

          $srcFile = "build\aro_launcher.c"
          $rcFile  = "build\aro_launcher.rc"
          $resFile = "build\aro_launcher.res"
          $outFile = "${{ matrix.release_dir }}\aro_launcher.exe"
          Set-Content -Path $srcFile -Value $launcherSrc

          $icoPath = (Resolve-Path "windows\runner\resources\app_icon.ico").Path -replace '\\','\\'
          Set-Content -Path $rcFile -Value "1 ICON `"$icoPath`""
          rc.exe /nologo /fo $resFile $rcFile

          cl.exe /nologo /O2 /MT /Fe:$outFile $srcFile $resFile /link shell32.lib user32.lib /SUBSYSTEM:WINDOWS /MACHINE:${{ matrix.launcher_machine }}

          if (Test-Path $outFile) {
            Write-Host "Built aro_launcher.exe (${{ matrix.arch }}, static CRT)" -ForegroundColor Green
            dumpbin /DEPENDENTS $outFile | Select-String '\.dll'
          } else {
            Write-Host "WARNING: Failed to build launcher" -ForegroundColor Yellow
          }

      - name: Audit DLL dependencies
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          $releaseDir = "${{ matrix.release_dir }}"

          Get-ChildItem -Path $releaseDir -Recurse -Filter "dartjni.dll" |
            ForEach-Object {
              Write-Host "Removing Android-only $($_.Name) from Release bundle"
              Remove-Item $_.FullName -Force
            }

          $systemDlls = @(
            'kernel32.dll','ntdll.dll','user32.dll','gdi32.dll','advapi32.dll',
            'shell32.dll','ole32.dll','oleaut32.dll','comctl32.dll','comdlg32.dll',
            'ws2_32.dll','wsock32.dll','winmm.dll','shlwapi.dll','version.dll',
            'setupapi.dll','crypt32.dll','wintrust.dll','secur32.dll','bcrypt.dll',
            'ncrypt.dll','iphlpapi.dll','dnsapi.dll','userenv.dll','netapi32.dll',
            'dwmapi.dll','uxtheme.dll','imm32.dll','msimg32.dll','gdiplus.dll',
            'd3d11.dll','d3d9.dll','dxgi.dll','d2d1.dll','dwrite.dll',
            'opengl32.dll','winhttp.dll','wininet.dll','urlmon.dll',
            'msvcrt.dll','ucrtbase.dll','rpcrt4.dll','powrprof.dll',
            'api-ms-win-*.dll','ext-ms-win-*.dll',
            'msvcp_win.dll','combase.dll','kernelbase.dll',
            'dbghelp.dll','psapi.dll','wtsapi32.dll','propsys.dll',
            'shcore.dll','profapi.dll','cabinet.dll','msi.dll',
            'uiautomationcore.dll','oleacc.dll',
            'vcomp140.dll'
          )

          function Is-SystemDll($name) {
            foreach ($pattern in $systemDlls) {
              if ($pattern.Contains('*')) {
                if ($name -like $pattern) { return $true }
              } elseif ($name -eq $pattern) {
                return $true
              }
            }
            return $false
          }

          $binaries = Get-ChildItem -Path $releaseDir -Recurse -Include *.exe,*.dll
          $bundledNames = $binaries | ForEach-Object { $_.Name.ToLower() }
          $missing = @()

          foreach ($bin in $binaries) {
            $deps = & dumpbin /DEPENDENTS $bin.FullName 2>$null |
                    Select-String '^\s+\S+\.dll$' |
                    ForEach-Object { $_.Line.Trim().ToLower() }
            foreach ($dep in $deps) {
              if ($dep -and (-not (Is-SystemDll $dep)) -and ($dep -notin $bundledNames)) {
                $missing += [PSCustomObject]@{ Binary=$bin.Name; Missing=$dep }
              }
            }
          }

          Write-Host "===== DLL Dependency Audit (${{ matrix.arch }}) =====" -ForegroundColor Cyan
          Write-Host "Scanned $($binaries.Count) binaries in $releaseDir"
          if ($missing.Count -gt 0) {
            Write-Host ""
            Write-Host "WARNING: Missing DLL dependencies:" -ForegroundColor Red
            $missing | Format-Table -AutoSize
            exit 1
          } else {
            Write-Host "All dependencies satisfied." -ForegroundColor Green
          }

      - name: Upload Windows ${{ matrix.arch }} build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.FLUTTER_DIR }}/${{ matrix.release_dir }}/

  package-windows-installer:
    needs: [prepare, build-windows]
    if: needs.prepare.outputs.build_core == 'true'
    name: Package Windows Installer (x64 + ARM64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows x64 build
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-build
          path: staging/x64

      - name: Download Windows ARM64 build
        uses: actions/download-artifact@v4
        with:
          name: windows-arm64-build
          path: staging/arm64

      - name: Verify downloads
        run: |
          Write-Host "=== x64 build ===" -ForegroundColor Cyan
          Get-ChildItem -Path staging/x64 -Recurse | Select-Object FullName, Length
          Write-Host "=== ARM64 build ===" -ForegroundColor Cyan
          Get-ChildItem -Path staging/arm64 -Recurse | Select-Object FullName, Length

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Create unified installer script
        run: |
          $installerScript = @"
          #define MyAppName "ARO Desktop"
          #define MyAppVersion "1.0.0"
          #define MyAppExeName "aro_desktop.exe"
          #define MyAppMutexName "AROClientMutex"

          [Setup]
          AppId={{12345678-1234-1234-1234-123456789012}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppVerName={#MyAppName} {#MyAppVersion}
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          UninstallDisplayIcon={app}\{#MyAppExeName}
          OutputDir=.\
          OutputBaseFilename=AROClient-Setup
          Compression=lzma
          SolidCompression=yes
          PrivilegesRequired=lowest
          ; Allow installer to run on both x64 and ARM64 Windows
          ArchitecturesAllowed=x64compatible arm64
          ArchitecturesInstallIn64BitMode=x64compatible arm64
          DisableDirPage=no
          AllowUNCPath=no
          AllowNoIcons=yes
          UninstallFilesDir={app}\uninstall
          CreateUninstallRegKey=yes
          Uninstallable=yes

          ; IMPORTANT: We want to BLOCK uninstall when the app is running.
          CloseApplications=no
          RestartApplications=no

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop icon"; GroupDescription: "Additional icons";
          Name: "quicklaunchicon"; Description: "Create a Quick Launch icon"; GroupDescription: "Additional icons"; Flags: unchecked; OnlyBelowVersion: 6.1
          Name: "startmenu"; Description: "Create Start Menu shortcuts"; GroupDescription: "Additional icons";
          Name: "autostart"; Description: "Run at startup"; GroupDescription: "Launch options";
          Name: "contextmenu"; Description: "Add context menu shortcuts"; GroupDescription: "Shell integration";

          [Files]
          ; Install x64 files on x64 systems
          Source: "staging\x64\*"; DestDir: "{app}"; Check: not IsArm64; Flags: ignoreversion recursesubdirs createallsubdirs
          ; Install ARM64 files on native ARM64 systems
          Source: "staging\arm64\*"; DestDir: "{app}"; Check: IsArm64; Flags: ignoreversion recursesubdirs createallsubdirs solidbreak

          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\aro_launcher.exe"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\aro_launcher.exe"; Tasks: desktopicon; WorkingDir: "{app}"
          Name: "{userappdata}\Microsoft\Internet Explorer\Quick Launch\{#MyAppName}"; Filename: "{app}\aro_launcher.exe"; Tasks: quicklaunchicon
          Name: "{group}\Uninstall {#MyAppName}"; Filename: "{uninstallexe}"

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "{cm:LaunchProgram,{#StringChange(MyAppName, '&', '&&')}}"; Flags: nowait postinstall skipifsilent

          [Registry]
          Root: "HKCU"; Subkey: "Software\Microsoft\Windows\CurrentVersion\Run"; ValueName: "{#MyAppName}"; ValueType: string; ValueData: "{app}\aro_launcher.exe"; Flags: uninsdeletevalue; Tasks: autostart
          Root: "HKCU"; Subkey: "Software\Classes\*\shell\Open with {#MyAppName}"; ValueType: string; ValueData: "Open with {#MyAppName}"; Tasks: contextmenu; Flags: uninsdeletekey
          Root: "HKCU"; Subkey: "Software\Classes\*\shell\Open with {#MyAppName}\command"; ValueType: string; ValueData: """{app}\{#MyAppExeName}"" ""%1"""; Tasks: contextmenu

          [UninstallDelete]
          Type: filesandordirs; Name: "{userappdata}\com.aro\ARO Desktop"
          Type: filesandordirs; Name: "{localappdata}\com.aro\ARO Desktop"
          Type: filesandordirs; Name: "{userappdata}\com.aro\aro_client"
          Type: filesandordirs; Name: "{localappdata}\com.aro\aro_client"
          Type: dirifempty; Name: "{userappdata}\com.aro"
          Type: dirifempty; Name: "{localappdata}\com.aro"
          Type: dirifempty; Name: "{app}"

          [Code]

          const
            MB_TOPMOST_FLAG = 262144;
            MB_ICONINFORMATION_FLAG = 64;

          function MessageBoxW(hWnd: Integer; lpText, lpCaption: string; uType: Cardinal): Integer;
            external 'MessageBoxW@user32.dll stdcall';

          procedure ShowAppRunningCannotUninstall();
          var
            Text: string;
          begin
            Text :=
              '{#MyAppName} is currently running and cannot be uninstalled.' + #13#10 + #13#10 +
              'Please quit/close {#MyAppName} (including the system tray icon), then run the uninstaller again.';
            MessageBoxW(0, Text, '{#MyAppName}', MB_OK or MB_ICONINFORMATION_FLAG or MB_TOPMOST_FLAG);
          end;

          function IsProcessRunning(ProcessName: string): Boolean;
          var
            ResultCode: Integer;
            Cmd: string;
          begin
            Result := False;
            Cmd :=
              'tasklist /FI "IMAGENAME eq ' + ProcessName + '" /NH '
              + '| find /I "' + ProcessName + '" >nul';
            if Exec('cmd.exe', '/c ' + Cmd, '', SW_HIDE, ewWaitUntilTerminated, ResultCode) then
              Result := ResultCode = 0;
          end;

          function IsAppRunning(): Boolean;
          begin
            Result :=
              CheckForMutexes('{#MyAppMutexName}') or
              IsProcessRunning('{#MyAppExeName}');
          end;

          function InitializeUninstall(): Boolean;
          begin
            if IsAppRunning() then
            begin
              ShowAppRunningCannotUninstall();
              Result := False;
              exit;
            end;
            Result := True;
          end;
          "@

          Set-Content -Path "aro_installer.iss" -Value $installerScript

      - name: Build unified installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" aro_installer.iss

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: AROClient-Setup.exe
          if-no-files-found: error

  build-linux2:
    needs: [prepare, build-core-linux, build-core-linux-arm64]
    if: needs.prepare.outputs.aro_linux == 'true'
    name: Build Tauri Linux Packages (ARO Desktop)
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: "debian:12"
            artifact_suffix: "debian-12"
            bundle_target: "deb"
            tauri_config: "src-tauri/tauri.debian.conf.json"
          # NOTE: Tauri (gtk-rs/glib-sys 0.18.x) requires GLib >= 2.70.
          # Rocky Linux 8/9 ship GLib < 2.70, so compiling inside those containers fails.
          # `rockylinux:10` is not (currently) published on Docker Hub, so use an EL10-compatible base.
         
          - distro: "quay.io/centos/centos:stream10"
            artifact_suffix: "centos-stream-10"
            bundle_target: "rpm"
            tauri_config: "src-tauri/tauri.centos-stream10.conf.json"

    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}

    env:
      BUNDLE_TARGET: ${{ matrix.bundle_target }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux x64 Core Library
        uses: actions/download-artifact@v4
        with:
          name: libstudy-linux
          path: plugins/linux

      - name: Download Linux ARM64 Core Library
        uses: actions/download-artifact@v4
        with:
          name: libstudy-linux-arm64
          path: plugins/linux-arm64

      - name: Copy Core Libraries to Tauri Resources
        run: |
          set -euo pipefail
          mkdir -p apps/aro_linux/src-tauri/resources
          cp plugins/linux/libstudy.so apps/aro_linux/src-tauri/resources/
          ls -lh apps/aro_linux/src-tauri/resources/libstudy.so

      - name: Install Dependencies
        run: |
          set -euo pipefail

          retry() {
            local attempts="${1:-5}"
            local sleep_seconds="${2:-3}"
            shift 2 || true
            local n=0
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge "$attempts" ]; then
                return 1
              fi
              sleep $((sleep_seconds * n))
            done
          }

          if [ -f /etc/debian_version ]; then
            retry 5 3 apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
            retry 5 3 env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends --fix-missing \
              git curl jq ca-certificates \
              clang build-essential pkg-config \
              libssl-dev libgtk-3-dev libglib2.0-dev patchelf \
              dpkg fakeroot xz-utils

            if ! env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends --fix-missing libwebkit2gtk-4.1-dev; then
              retry 3 3 env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends --fix-missing libwebkit2gtk-4.0-dev
            fi

            if ! env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends --fix-missing libayatana-appindicator3-dev; then
              retry 3 3 env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends --fix-missing libappindicator3-dev
            fi

            # Set PKG_CONFIG_PATH for Debian-based systems
            export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}" >> $GITHUB_ENV
          elif command -v dnf >/dev/null 2>&1; then
            # Rocky/RHEL often need EPEL for appindicator/ayatana packages.
            dnf install -y dnf-plugins-core || true
            dnf install -y epel-release || true
            # EL8/EL9/EL10: repo name varies (powertools/PowerTools/crb). Not all images have it.
            dnf config-manager --set-enabled crb || true
            dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled PowerTools || true

            dnf -y makecache
            # Some images ship curl-minimal; swap to curl to avoid dependency conflicts.
            if rpm -q curl-minimal >/dev/null 2>&1; then
              dnf -y swap curl-minimal curl --allowerasing || true
            fi

            # pkg-config binary is provided by pkgconf-pkg-config on RHEL/Rocky.
            dnf install -y --allowerasing git curl jq which ca-certificates \
              clang gcc gcc-c++ make pkgconf-pkg-config \
              openssl-devel glib2 glib2-devel \
              rpm-build

            # Diagnostics: ensure glib-2.0.pc is present and visible to pkg-config.
            command -v pkg-config
            pkg-config --version
            rpm -q glib2 glib2-devel || true
            ls -lah /usr/lib64/pkgconfig/glib-2.0.pc /usr/lib/pkgconfig/glib-2.0.pc 2>/dev/null || true

            # AppIndicator headers (tray).
            # Prefer Ayatana first because modern distros ship it by default and it avoids
            # generating runtime deps on legacy libappindicator3.
            if ! dnf install -y libayatana-appindicator-gtk3-devel; then
              if ! dnf install -y libappindicator-gtk3-devel; then
                echo "ERROR: missing appindicator development package (libappindicator-gtk3-devel or libayatana-appindicator-gtk3-devel)." >&2
                echo "Hint: ensure EPEL is available for this distro." >&2
                exit 1
              fi
            fi

            # WebKitGTK: if building with webkitgtk-6.0 (GTK4), install those; otherwise use GTK3 webkit.
            if [[ "${{ matrix.tauri_features }}" == *"webkitgtk-6-0"* ]]; then
              dnf install -y gtk4-devel webkitgtk6.0-devel
            else
              dnf install -y gtk3-devel
              # Prefer WebKitGTK 4.1 when available; fall back to 4.0 (webkit2gtk3) for older distros.
              if ! dnf install -y webkit2gtk4.1-devel; then
                dnf install -y webkit2gtk3-devel
              fi
            fi

            # Set PKG_CONFIG_PATH for Rocky/RHEL-based systems
            export PKG_CONFIG_PATH="/usr/lib64/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}" >> $GITHUB_ENV
          else
            echo "Unsupported distro (no apt-get/dnf)." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/aro_linux/src-tauri/target
          key: ${{ runner.os }}-cargo-tauri-${{ matrix.artifact_suffix }}-${{ hashFiles('apps/aro_linux/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-${{ matrix.artifact_suffix }}-

      - name: Install Tauri CLI
        run: |
          set -euo pipefail
          # NOTE: tauri-cli does not publish every tauri crate patch version (e.g. 2.0.6 doesn't exist on crates.io).
          # Pin to a known-good v2 CLI release to avoid unexpected breaking changes.
          cargo install tauri-cli --version "2.2.7" --locked

      - name: Ensure Debian scripts executable
        run: |
          set -euo pipefail
          chmod +x apps/aro_linux/src-tauri/installer/deb/*

      - name: Ensure RPM scripts executable
        run: |
          set -euo pipefail
          chmod +x apps/aro_linux/src-tauri/installer/rpm/*

      - name: Build Package (${{ matrix.bundle_target }})
        working-directory: apps/aro_linux
        run: |
          set -euo pipefail

          # Tauri CLI only accepts a single --config argument. Generate one merged config
          # (base + common Linux overrides + per-distro overrides) and pass it once.
          jq -s 'reduce .[] as $item ({}; . * $item)' \
            src-tauri/tauri.conf.json \
            src-tauri/tauri.linux.conf.json \
            "${{ matrix.tauri_config }}" \
            > src-tauri/tauri.merged.conf.json

          FEATURES_ARG=""
          if [ -n "${{ matrix.tauri_features }}" ]; then
            FEATURES_ARG="--features ${{ matrix.tauri_features }}"
          fi

          cargo tauri build --ci --config src-tauri/tauri.merged.conf.json $FEATURES_ARG
          ls -lah "src-tauri/target/release/bundle/${BUNDLE_TARGET}" || true

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: aro-desktop-${{ matrix.bundle_target }}-${{ matrix.artifact_suffix }}
          path: apps/aro_linux/src-tauri/target/release/bundle/${{ matrix.bundle_target }}/*.${{ matrix.bundle_target }}
          if-no-files-found: error

 